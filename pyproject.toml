[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "tilec"
version = "0.1.0"
description = "A Triton-compatible tile language with an Apple GPU (Metal) backend"
dependencies = ["numpy"]

[project.optional-dependencies]
mps = ["torch"]
test = ["pytest"]

[tool.setuptools]
packages = ["tilec"]
