[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "tilec"
version = "0.1.0"
description = "A Triton-like tile language for Apple GPUs: Python front end, Rust compiler, Metal backend"
requires-python = ">=3.10"
dependencies = ["torch>=2.5"]

[project.optional-dependencies]
test = ["pytest", "numpy"]

[tool.maturin]
module-name = "tilec._core"          # src/lib.rs becomes tilec/_core.*.so
python-source = "."                  # the Python package is ./tilec
features = ["pyo3/extension-module"]
